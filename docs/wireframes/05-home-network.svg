n the current network.</text><text x="16" y="142" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5f6368" text-anchor="start">Use a name only your home DNS server answers.</text><rect x="16.0" y="153" width="328.0" height="48" rx="4" fill="#ffffff" stroke="#5f6368" stroke-width="1"/><text x="28.0" y="170" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#5f6368" text-anchor="start">Host name</text><text x="28.0" y="189" font-family="'Roboto Mono', Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#202124" text-anchor="start">internal.domain</text><text x="16" y="221" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#5f6368" text-anchor="start">Record type</text><rect x="16" y="229" width="164.0" height="36" rx="18" fill="#202124" stroke="#202124" stroke-width="1"/><text x="98.0" y="251.5" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#ffffff" text-anchor="middle">TXT (preferred)</text><rect x="180.0" y="229" width="164.0" height="36" rx="18" fill="#ffffff" stroke="#202124" stroke-width="1.2"/><text x="262.0" y="251.5" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#202124" text-anchor="middle">A record</text><rect x="16.0" y="277" width="328.0" height="48" rx="4" fill="#ffffff" stroke="#5f6368" stroke-width="1"/><text x="28.0" y="294" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#5f6368" text-anchor="start">Expected TXT value</text><text x="28.0" y="313" font-family="'Roboto Mono', Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#202124" text-anchor="start">True</text><rect x="16" y="335" width="328" height="64" rx="12" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="1"/><text x="32" y="359" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5f6368" text-anchor="start">Latest lookup</text><text x="32" y="381" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#202124" text-anchor="start">TXT value matched · 18:22:51</text><rect x="287" y="345" width="41" height="20" rx="10" fill="#202124" stroke="#202124" stroke-width="1"/><text x="307.5" y="359" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="500" fill="#ffffff" text-anchor="middle">Home</text><text x="16" y="429" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="500" fill="#5f6368" text-anchor="start">REACHABILITY PROBE (OPTIONAL)</text><text x="16" y="451" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5f6368" text-anchor="start">Not required. If set, Home also needs a TCP</text><text x="16" y="468" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5f6368" text-anchor="start">connect to this LAN address to succeed.</text><rect x="16" y="479" width="209.92000000000002" height="48" rx="4" fill="#ffffff" stroke="#5f6368" stroke-width="1"/><text x="28" y="496" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#5f6368" text-anchor="start">Probe host</text><text x="28" y="515" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#202124" text-anchor="start">Not set</text><rect x="233.92000000000002" y="479" width="110.08" height="48" rx="4" fill="#ffffff" stroke="#5f6368" stroke-width="1"/><text x="245.92000000000002" y="496" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#5f6368" text-anchor="start">Port</text><text x="245.92000000000002" y="515" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill=
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 492" width="760" height="492" role="img" aria-label="At home connections go direct; away they go through the tunnel" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>At home connections go direct; away they go through the tunnel</title><rect width="760" height="492" fill="#ffffff"/><defs><marker id="arch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#80868b"/></marker><marker id="arch-arrow-home" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f6fde"/></marker><marker id="arch-arrow-away" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d9730d"/></marker></defs><text x="24" y="28" font-size="15" font-weight="600" fill="#202124">At home connections go direct; away they go through the tunnel</text><rect x="176" y="48" width="384" height="284" rx="12" fill="none" stroke="#c4c7cc" stroke-width="1.25"/><text x="192" y="70" font-weight="600" fill="#5f6368">The app, one foreground service</text><rect x="176" y="356" width="384" height="112" rx="12" fill="none" stroke="#c4c7cc" stroke-width="1.25"/><text x="368" y="378" font-weight="600" text-anchor="middle" fill="#5f6368">Home network</text><rect x="24" y="76" width="132" height="72" rx="8" fill="none" stroke="#80868b" stroke-width="1.25"/><text x="90" y="100" font-weight="600" text-anchor="middle" fill="#202124">Other apps</text><text x="90" y="116" font-size="11.5" text-anchor="middle" fill="#5f6368">connect to</text><text x="90" y="132" font-size="11.5" text-anchor="middle" fill="#5f6368">127.0.0.1 ports</text><rect x="192" y="84" width="352" height="56" rx="8" fill="none" stroke="#80868b" stroke-width="1.25"/><text x="368" y="108" font-weight="600" text-anchor="middle" fill="#202124">Local listeners</text><text x="368" y="124" font-size="11.5" text-anchor="middle" fill="#5f6368">forwards and the optional HTTP proxy</text><rect x="192" y="164" width="192" height="72" rx="8" fill="none" stroke="#80868b" stroke-width="1.25"/><text x="288" y="188" font-weight="600" text-anchor="middle" fill="#202124">Router</text><text x="288" y="204" font-size="11.5" text-anchor="middle" fill="#5f6368">picks a route for each</text><text x="288" y="220" font-size="11.5" text-anchor="middle" fill="#5f6368">new connection by mode</text><rect x="408" y="164" width="136" height="72" rx="8" fill="none" stroke="#80868b" stroke-width="1.25"/><text x="476" y="188" font-weight="600" text-anchor="middle" fill="#202124">Mode detector</text><text x="476" y="204" font-size="11.5" text-anchor="middle" fill="#5f6368">home DNS check</text><text x="476" y="220" font-size="11.5" text-anchor="middle" fill="#5f6368">network state</text><rect x="192" y="260" width="168" height="56" rx="8" fill="#2f6fde" fill-opacity="0.12" stroke="#2f6fde" stroke-width="2"/><text x="276" y="284" font-weight="600" text-anchor="middle" fill="#202124">Direct dial</text><text x="276" y="300" font-size="11.5" text-anchor="middle" fill="#5f6368">bound to home network</text><rect x="376" y="260" width="168" height="56" rx="8" fill="#d9730d" fill-opacity="0.12" stroke="#d9730d" stroke-width="2"/><text x="460" y="284" font-weight="600" text-anchor="middle" fill="#202124">WireGuard tunnel</text><text x="460" y="300" font-size="11.5" text-anchor="middle" fill="#5f6368">userspace, on demand</text><rect x="192" y="396" width="168" height="56" rx="8" fill="none" stroke="#80868b" stroke-width="1.25"/><text x="276" y="420" font-weight="600" text-anchor="middle" fill="#202124">Target hosts</text><text x="276" y="436" font-size="11.5" text-anchor="middle" fill="#5f6368">forwarded services</text><rect x="392" y="396" width="152" height="56" rx="8" fill="none" stroke="#80868b" stroke-width="1.25"/><text x="468" y="420" font-weight="600" text-anchor="middle" fill="#202124">WireGuard peer</text><text x="468" y="436" font-size="11.5" text-anchor="middle" fill="#5f6368">the home endpoint</text><g fill="none" stroke-width="1.25"><path d="M156 112H192" stroke="#80868b" marker-end="url(#arch-arrow)"/><path d="M288 140V164" stroke="#80868b" marker-end="url(#arch-arrow)"/><path d="M408 200H384" stroke="#80868b" marker-end="url(#arch-arrow)"/><path d="M276 236V260" stroke="#2f6fde" marker-end="url(#arch-arrow-home)"/><path d="M360 236V248H460V260" stroke="#d9730d" marker-end="url(#arch-arrow-away)"/><path d="M276 316V396" stroke="#2f6fde" marker-end="url(#arch-arrow-home)"/><path d="M460 316V396" stroke="#d9730d" marker-end="url(#arch-arrow-away)"/><path d="M392 424H360" stroke="#d9730d" marker-end="url(#arch-arrow-away)"/></g><text x="284" y="349" font-size="11.5" fill="#5f6368">LAN, no tunnel</text><text x="468" y="349" font-size="11.5" fill="#5f6368">over the internet</text><line x1="584" y1="88" x2="604" y2="88" stroke="#2f6fde" stroke-width="2"/><text x="612" y="92" fill="#202124">Home route</text><line x1="584" y1="112" x2="604" y2="112" stroke="#d9730d" stroke-width="2"/><text x="612" y="116" fill="#202124">Away route</text><line x1="584" y1="136" x2="604" y2="136" stroke="#80868b" stroke-width="1.25"/><text x="612" y="140" fill="#202124">Every mode</text></svg>